<div class="contact-wrap">
  <div class="contact-card reveal">
    <h2 style="font-family:var(--font-display);font-size:1.4rem;margin-bottom:6px;color:var(--text);text-align: center;">Contact Me</h2>
    <p style="margin-bottom:28px;text-align: center;">Send a message or connect on social media.</p>

    <form id="contactForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-input" placeholder="Prabin Yadav" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-input" placeholder="Your message here..." required></textarea>
      </div>
      <button type="submit" class="form-submit">
        <i class="fas fa-paper-plane"></i> Send Message
      </button>
    </form>

    <div class="social-icons">
      <a class="social-icon" href="https://facebook.com/prabin.yadav.739326" target="_blank" title="Facebook">

      </a>
      <a class="social-icon" href="https://linkedin.com/in/prabinyadav" target="_blank" title="LinkedIn">

      </a>
      <a class="social-icon" href="https://mail.google.com/mail/?view=cm&fs=1&to=prabin.yadav.0.0.18@gmail.com" target="_blank" title="Email">
