<!DOCTYPE html>
           <html>
             <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Admin Dashboard</title>
               <link rel="stylesheet" href="admin.css">
           </head>

      <body>

              <div class="dashboard">

           <h2>Project Manager</h2>

               <input id="title" placeholder="Project Title">
             <input id="desc" placeholder="Project Description">
                     <input type="file" id="imgFile" accept="image/*">

                        <button onclick="addProject()">Add Project</button>

                   <h3>Projects</h3>
            <div id="projectAdminList"></div>

                 <button id="logoutBtn">Logout</button>

            </div>
            


              <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDlfhntuMeY6aSbgWWRdde7ZBRZOItu8Bk",
    authDomain: "prabin-portfolio-admin.firebaseapp.com",
    projectId: "prabin-portfolio-admin",
    storageBucket: "prabin-portfolio-admin.firebasestorage.app",
    messagingSenderId: "30623016582",
    appId: "1:30623016582:web:b1ea62a0da6dad1752d307",
    measurementId: "G-LMJMDB4TBF"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});

const logoutBtn = document.getElementById("logoutBtn");
if (logoutBtn) {
  logoutBtn.addEventListener("click", () => {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  });
}
</script>

        <script src="admin.js"></script>
       </body>
</html>
