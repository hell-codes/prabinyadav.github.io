<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Prabin Yadav</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <canvas id="adminBg"></canvas>

<div class="dashboard">

  <img src="assets/logo.png" class="logo" alt="Prabin Logo">

  <h2>Project Manager</h2>
  <p class="subtitle">Add or remove projects from your portfolio</p>

  <div class="divider"></div>


  <div class="input-group">
    <label class="input-label">Project Title</label>
    <input id="title" type="text" placeholder="e.g. To-Do App">
  </div>

  <div class="input-group">
    <label class="input-label">Description</label>
    <input id="desc" type="text" placeholder="Brief project description">
  </div>

  <div class="input-group">
    <label class="input-label">Project Image</label>
    <input type="file" id="imgFile" accept="image/*">
  </div>

  <button onclick="addProject()">+ Add Project</button>

  <div class="divider"></div>


  <h3>Your Projects</h3>
  <div id="projectAdminList"></div>

  <div class="divider"></div>

  <button id="logoutBtn">↩ Logout</button>

</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyC88KmP_zGtFuPh7lLmurCqYwtYyDw3Ff0",
    authDomain: "prabin-portfolio-admin.firebaseapp.com",
    projectId: "prabin-portfolio-admin",
    storageBucket: "prabin-portfolio-admin.firebasestorage.app",
    messagingSenderId: "30623016582",
    appId: "1:30623016582:web:b1ea62a0da6dad1752d307",
    measurementId: "G-LMJMDB4TBF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});

const logoutBtn = document.getElementById("logoutBtn");
if (logoutBtn) {
  logoutBtn.addEventListener("click", () => {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  });
}
</script>

<script src="bg.js"></script>
<script type="module" src="admin.js"></script>

</body>
</html>
