<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Prabin Yadav</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<canvas id="adminBg"></canvas>

<div class="dashboard">

  <img src="assets/logo.png" class="logo" alt="Prabin Logo">

  <h2>Project Manager</h2>
  <p class="subtitle">Add or remove projects from your portfolio</p>

  <div class="divider"></div>

  <div class="input-group">
    <label class="input-label">Project Title</label>
    <input id="title" type="text" placeholder="e.g. To-Do App">
  </div>

  <div class="input-group">
    <label class="input-label">Description</label>
    <input id="desc" type="text" placeholder="Brief project description">
  </div>

  <div class="input-group">
    <label class="input-label">Project Image</label>
    <input type="file" id="imgFile" accept="image/*">
  </div>

  <button id="addBtn">+ Add Project</button>

  <div class="divider"></div>

  <h3>Your Projects</h3>
  <div id="projectAdminList"></div>

  <div class="divider"></div>

  <button id="logoutBtn">↩ Logout</button>

</div>

<script src="bg.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyC88KmP_zGtFuPh7lLmurCqYwtYyDw3Ff0",
  authDomain:        "prabin-portfolio-admin.firebaseapp.com",
  projectId:         "prabin-portfolio-admin",
  storageBucket:     "prabin-portfolio-admin.firebasestorage.app",
  messagingSenderId: "30623016582",
  appId:             "1:30623016582:web:b1ea62a0da6dad1752d307"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(auth).then(() => { window.location.href = "login.html"; });
});

const adminList  = document.getElementById("projectAdminList");

async function loadProjects() {
  adminList.innerHTML = "<p style='color:var(--text-3);font-size:.85rem;'>Loading...</p>";
  const q    = query(collection(db, "projects"), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);
  adminList.innerHTML = "";

  if (snap.empty) {
    adminList.innerHTML = "<div class='empty-state'>No projects yet. Add one above.</div>";
    return;
  }

  snap.forEach(docSnap => {
    const p  = docSnap.data();
    const id = docSnap.id;
    const item = document.createElement("div");
    item.className = "projectItem";
    item.innerHTML = `
      <span>${p.title}</span>
      <button data-id="${id}">Delete</button>`;
    adminList.appendChild(item);
  });

  adminList.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", () => deleteProject(btn.dataset.id));
  });
}

async function deleteProject(id) {
  if (!confirm("Delete this project?")) return;
  await deleteDoc(doc(db, "projects", id));
  loadProjects();
}

function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("File read failed"));
    reader.onload  = e => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image load failed"));
      img.onload  = () => {
        const scale  = Math.min(1, maxWidth / img.width);
        const cvs    = document.createElement("canvas");
        cvs.width    = Math.round(img.width  * scale);
        cvs.height   = Math.round(img.height * scale);
        cvs.getContext("2d").drawImage(img, 0, 0, cvs.width, cvs.height);

        let dataUrl = cvs.toDataURL("image/jpeg", quality);
        if (dataUrl.length > 700_000) dataUrl = cvs.toDataURL("image/jpeg", 0.45);
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addProject() {
  const titleInput = document.getElementById("title");
  const descInput  = document.getElementById("desc");
  const fileInput  = document.getElementById("imgFile");
  const btn        = document.getElementById("addBtn");

  const title = titleInput.value.trim();
  const desc  = descInput.value.trim();
  const file  = fileInput.files[0];

  if (!title) return alert("Enter a title");
  if (!desc)  return alert("Enter a description");
  if (!file)  return alert("Select an image");

  if (file.size > 5 * 1024 * 1024)
    return alert("Image too large. Please use an image under 5 MB.");

  btn.textContent = "Compressing…";
  btn.disabled    = true;

  try {
    const imgData = await compressImage(file);

    if (imgData.length > 900_000) {
      btn.textContent = "+ Add Project";
      btn.disabled    = false;
      return alert("Image still too large after compression. Please use a smaller image.");
    }

    btn.textContent = "Uploading…";

    await addDoc(collection(db, "projects"), {
      title,
      desc,
      img:       imgData,
      createdAt: Date.now()
    });

    titleInput.value = "";
    descInput.value  = "";
    fileInput.value  = "";

    btn.textContent = "+ Add Project";
    btn.disabled    = false;

    loadProjects();

  } catch (err) {
    console.error("Upload error:", err);
    alert("Upload failed: " + err.message);
    btn.textContent = "+ Add Project";
    btn.disabled    = false;
  }
}

document.getElementById("addBtn").addEventListener("click", addProject);

loadProjects();
</script>

</body>
</html>
