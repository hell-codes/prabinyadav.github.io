<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access — Prabin Yadav</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <canvas id="adminBg"></canvas>

<div class="container">

  <img src="assets/logo.png" class="logo" alt="Prabin Logo">

  <h2>Admin Access</h2>
  <p class="subtitle">Sign in to manage your portfolio</p>

  <form id="login-form">

    <div class="input-group">
      <label class="input-label">Email Address</label>
      <input type="email" id="login-email" placeholder="admin@example.com" required>
    </div>

    <div class="input-group">
      <label class="input-label">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" required>
    </div>

    <button type="submit">Sign In</button>

  </form>

</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyC88KmP_zGtFuPh7lLmurCqYwtYyDw3Ff0",
    authDomain: "prabin-portfolio-admin.firebaseapp.com",
    projectId: "prabin-portfolio-admin",
    storageBucket: "prabin-portfolio-admin.firebasestorage.app",
    messagingSenderId: "30623016582",
    appId: "1:30623016582:web:b1ea62a0da6dad1752d307",
    measurementId: "G-LMJMDB4TBF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginForm = document.getElementById("login-form");

loginForm.addEventListener("submit", (e) => {
  e.preventDefault();

  const email    = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  const btn = loginForm.querySelector("button");
  btn.textContent = "Signing in...";
  btn.disabled = true;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "dashboard.html";
    })
    .catch(() => {
      alert("Invalid login");
      btn.textContent = "Sign In";
      btn.disabled = false;
    });
});
</script>

<script src="bg.js"></script>

</body>
</html>
